<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudieBuddy</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="manifest" href="/static/img/site.webmanifest">
<meta name="theme-color" content="#056950">
<script>
  (function () {
    var klaar = null, t = null;
    try { klaar = localStorage.getItem("sb-onboarding-klaar"); t = localStorage.getItem("sb-theme"); } catch (e) {}
    if (!klaar) location.replace("/onboarding");
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #EFEDF6; --panel: #ffffff; --text: #17122B; --muted: #5E5878;
    --border: #DCD8EA; --accent: #056950; --accent-text: #ffffff;
    --bot: #ffffff; --hover: #E3F7F0;
  }
  :root[data-theme="dark"] {
    --bg: #17122B; --panel: #1F1937; --text: #F4F1FF; --muted: #B4ACD6;
    --border: #3A3160; --accent: #49E3BC; --accent-text: #17122B;
    --bot: #251E40; --hover: #302754;
  }
  .kop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .thema-knop {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .thema-knop svg { width: 18px; height: 18px; }
  .thema-knop .ico-zon { display: none; }
  :root[data-theme="dark"] .thema-knop .ico-zon { display: block; }
  :root[data-theme="dark"] .thema-knop .ico-maan { display: none; }
  .pakket-link { font-size: .9rem; color: var(--text); }
  .merk { display: flex; align-items: center; gap: 8px; font-family: "Bricolage Grotesque", Inter, sans-serif; font-weight: 800; letter-spacing: -.02em; }
  html body, html button, html textarea, html input { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* interactie */
  .thema-knop, form button, #geschiedenis button, .pakket-link, textarea {
    transition: transform .12s cubic-bezier(.2,.8,.2,1), background-color .2s, border-color .2s, box-shadow .2s, filter .2s, color .2s;
  }
  .thema-knop svg { transition: transform .35s cubic-bezier(.34,1.56,.64,1); }
  .thema-knop:active, form button:active:not(:disabled) { transform: scale(.92); }
  #geschiedenis button:active { transform: scale(.98); }
  textarea:focus { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
  @media (hover: hover) {
    .thema-knop:hover { background: var(--hover); border-color: var(--accent); }
    .thema-knop:hover svg { transform: rotate(-15deg); }
    form button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.07); box-shadow: 0 8px 20px -10px var(--accent); }
    #geschiedenis button:hover { transform: translateX(2px); }
    .pakket-link:hover { color: var(--accent); }
  }
  .bericht { animation: bericht-in .3s cubic-bezier(.2,.8,.2,1) both; }
  .user { transform-origin: bottom right; }
  .assistant { transform-origin: bottom left; }
  @keyframes bericht-in { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
  .typen { animation: bericht-in .3s both, knipper 1.2s ease-in-out .3s infinite; }
  @keyframes knipper { 50% { opacity: .5; } }
  .thema-wissel, .thema-wissel * { transition: background-color .35s, color .35s, border-color .35s !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: flex;
  }

  aside {
    width: 260px; flex-shrink: 0; background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 16px; display: flex; flex-direction: column; gap: 20px;
  }
  aside h1 { font-size: 1.2rem; margin: 0; }
  aside h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  #geschiedenis { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  #geschiedenis button {
    width: 100%; text-align: left; background: none; border: 0; color: var(--text);
    padding: 8px 10px; border-radius: 8px; cursor: pointer; font: inherit; font-size: .9rem;
  }
  #geschiedenis button:hover { background: var(--hover); }
  .leeg { color: var(--muted); font-size: .9rem; }
  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: .9rem; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 12px; }
  .bericht {
    max-width: min(70ch, 85%); padding: 10px 14px; border-radius: 14px;
    line-height: 1.45; white-space: pre-wrap; word-wrap: break-word;
  }
  .assistant { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .user { align-self: flex-end; background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 4px; }
  .typen { color: var(--muted); font-style: italic; }
  .systeem { align-self: center; background: transparent; color: var(--muted); font-size: .85rem; padding: 2px 10px; border: 1px dashed var(--border); border-radius: 999px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  #mijn-pakket { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--border); font-size: .9rem; }
  #mijn-pakket strong { font-size: .95rem; }
  #mijn-pakket .klein { color: var(--muted); font-size: .8rem; }
  #mijn-pakket .status { align-self: flex-start; font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--hover); }
  #mijn-pakket details summary { cursor: pointer; color: var(--muted); font-size: .8rem; }
  #mijn-pakket ul { margin: 6px 0 0; padding-left: 16px; }
  #mijn-pakket li { font-size: .8rem; }
  #mijn-pakket .sem { margin-top: 6px; font-size: .75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

  form {
    display: flex; gap: 8px; padding: 12px 16px 16px;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; max-height: 150px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  form button {
    background: var(--accent); color: var(--accent-text); border: 0; border-radius: 10px;
    padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: default; }

  @media (max-width: 700px) {
    body { flex-direction: column; }
    aside { width: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 12px 16px; gap: 10px; }
    #geschiedenis-blok { display: none; }
  }
</style>
</head>
<body>
  <aside>
    <div class="kop">
      <h1 class="merk"><img src="/static/img/mascotte-128.png" alt="" width="34" height="34">StudieBuddy</h1>
      <button class="thema-knop" type="button" data-theme-toggle>
        <svg class="ico-zon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-maan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <label class="toggle"><input type="checkbox" id="context" checked> Context aan</label>
    <section id="mijn-pakket" aria-label="Jouw studiepakket" hidden></section>
    <a class="pakket-link" href="/onboarding">Mijn studiepakket aanpassen</a>
    <div id="geschiedenis-blok">
      <h2>Vorige vragen</h2>
      <ul id="geschiedenis"></ul>
    </div>
  </aside>

  <main>
    <div id="chat" role="log" aria-live="polite" aria-label="Gesprek met StudieBuddy"></div>
    <form id="formulier">
      <label for="invoer" class="sr-only">Je vraag aan StudieBuddy</label>
      <textarea id="invoer" rows="1" placeholder="Stel je vraag…" maxlength="500" autofocus></textarea>
      <button id="verstuur" type="submit">Verstuur</button>
    </form>
  </main>

<script src="/static/js/theme.js"></script>
<script src="/static/js/data.js"></script>
<script>
  const chat = document.getElementById("chat");
  const invoer = document.getElementById("invoer");
  const knop = document.getElementById("verstuur");
  const context = document.getElementById("context");

  function toonBericht(rol, tekst, extraKlasse) {
    const div = document.createElement("div");
    div.className = `bericht ${rol} ${extraKlasse || ""}`;
    div.textContent = tekst;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  const OPSLAG = "studiebuddy_gesprek";  // gesprek blijft in deze browser bewaard, ook na een refresh
  let maxVragen = 5;

  function gesprek() {
    try { return JSON.parse(localStorage.getItem(OPSLAG)) || []; } catch { return []; }
  }

  function bewaar(rol, tekst) {
    try { localStorage.setItem(OPSLAG, JSON.stringify([...gesprek(), { rol, tekst }].slice(-50))); } catch { /* vol of privémodus */ }
  }

  function toonTeller(resterend) {
    toonBericht("systeem", `Nog ${resterend} van de ${maxVragen} vragen over`);
  }

  function toonGeschiedenis(vragen) {
    const lijst = document.getElementById("geschiedenis");
    lijst.replaceChildren();
    if (!vragen.length) {
      lijst.innerHTML = '<li class="leeg">Nog geen vragen</li>';
      return;
    }
    for (const vraag of [...vragen].reverse()) {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.textContent = vraag;
      b.title = "Opnieuw vragen";
      b.onclick = () => { invoer.value = vraag; invoer.focus(); };
      li.appendChild(b);
      lijst.appendChild(li);
    }
  }

  async function verstuur(e) {
    e.preventDefault();
    const vraag = invoer.value.trim();
    if (!vraag || knop.disabled) return;

    toonBericht("user", vraag);
    bewaar("user", vraag);
    invoer.value = "";
    invoer.style.height = "";
    knop.disabled = true;
    const typen = toonBericht("assistant", "StudieBuddy is aan het typen…", "typen");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ vraag, context: context.checked }),
      });
      const data = await res.json().catch(() => ({ fout: `Fout ${res.status}: probeer later opnieuw.` }));
      typen.remove();
      const tekst = data.antwoord || data.fout || "Geen antwoord ontvangen.";
      toonBericht("assistant", tekst);
      bewaar("assistant", tekst);
      if (data.vorige_vragen) toonGeschiedenis(data.vorige_vragen);
      if (data.resterend !== undefined) toonTeller(data.resterend);
    } catch {
      typen.remove();
      toonBericht("assistant", "Kan de server niet bereiken.");
    } finally {
      knop.disabled = false;
      invoer.focus();
    }
  }

  document.getElementById("formulier").addEventListener("submit", verstuur);
  invoer.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) verstuur(e);
  });
  invoer.addEventListener("input", () => {
    invoer.style.height = "";
    invoer.style.height = invoer.scrollHeight + "px";
  });
  context.addEventListener("change", () => {
    toonBericht("systeem", `Context staat nu ${context.checked ? "aan" : "uit"}`);
  });

  toonGeschiedenis([]);

  // Jouw studiepakket uit de onboarding in de zijbalk
  (async () => {
    const info = await SB.haalMijnPakketVolledig();
    const box = document.getElementById("mijn-pakket");
    if (!info) return;
    const { pakket, vakken } = info;
    const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const sp = vakken.reduce((t, v) => t + (Number(v.sp) || 0), 0);
    const status = { in_controle: "In controle", afgewezen: "Afgewezen" + (pakket.afwijsReden ? ": " + pakket.afwijsReden : ""), prive: "Privé" }[pakket.status];
    const semesters = ["1", "2", "1of2", "jaar"].filter((s) => vakken.some((v) => v.semester === s));
    box.innerHTML = `<strong>${esc(pakket.afstudeerrichting || "Gemeenschappelijk")} · ${esc(pakket.fase)}</strong>
      <span class="klein">${esc(pakket.richtingNaam)} · ${esc(pakket.academiejaar)} · ${vakken.length} vakken · ${sp} sp</span>
      ${status ? `<span class="status">${esc(status)}</span>` : ""}
      <details><summary>Toon vakken</summary>
        ${semesters.map((s) => `<div class="sem">${esc(SB.SEMESTERS[s])}</div><ul>${vakken.filter((v) => v.semester === s)
          .map((v) => `<li>${esc(v.naam)}${v.sp ? ` (${v.sp} sp)` : ""}${v.eigen ? " · eigen vak" : ""}</li>`).join("")}</ul>`).join("")}
      </details>`;
    box.hidden = false;
  })();
  toonBericht("assistant", "Hallo! Ik ben je StudieBuddy. Wat wil je weten?");
  for (const b of gesprek()) toonBericht(b.rol === "user" ? "user" : "assistant", String(b.tekst));

  // Teller en eigen vorige vragen ophalen, zodat een refresh niets lijkt te resetten.
  fetch("/api/status")
    .then((res) => res.json())
    .then((data) => {
      maxVragen = data.max_vragen;
      toonGeschiedenis(data.vorige_vragen);
      toonTeller(data.resterend);
    })
    .catch(() => {});
</script>
</body>
</html>
