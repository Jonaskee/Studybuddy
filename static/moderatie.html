<!doctype html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moderatie – StudieBuddy</title>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("sb-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="manifest" href="/static/img/site.webmanifest">
<meta name="theme-color" content="#056950">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/css/studybuddy.css">
<style>
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 2px solid var(--card); }
  .bar-right { display: flex; align-items: center; gap: 10px; }
  .count { font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 12px; background: var(--groen); color: var(--on-groen); }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 20px 40px; display: flex; flex-direction: column; gap: 20px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .layout { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .queue { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 18px; border: 3px solid transparent; background: var(--card); box-shadow: 0 0 0 1px var(--ring); text-align: left; cursor: pointer; width: 100%; color: var(--text); }
  .item[aria-current="true"] { border-color: var(--groen-line); }
  .item .tile { width: 48px; height: 48px; border-radius: 14px; background: var(--chip); color: var(--chip-text); font-family: "Bricolage Grotesque", sans-serif; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .item[aria-current="true"] .tile { background: var(--groen); color: var(--on-groen); }
  .item .body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .item .t { font-size: 15px; font-weight: 700; }
  .flag { font-size: 12px; font-weight: 700; }
  .detail { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 22px; padding: 24px; border-radius: 24px; background: var(--card); box-shadow: 0 0 0 1px var(--ring); }
  .detail h1 { font-size: clamp(24px, 3vw, 30px); }
  .panel { display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 18px; background: var(--bg); }
  .meter { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 5px; background: var(--text); }
  .tag { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 8px; background: var(--chip); color: var(--chip-text); }
  .tag.ok { background: var(--groen); color: var(--on-groen); }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
  .cap { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .empty { padding: 40px 24px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .quote { padding: 14px 16px; border-radius: 14px; background: var(--bg); font-size: 15px; }
  .demo { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
  <header class="bar">
    <a class="logo" href="/"><img src="/static/img/mascotte-128.png" alt="" width="38" height="38">Moderatie</a>
    <div class="bar-right">
      <span class="count" id="count" aria-live="polite"></span>
      <button class="icon-btn theme-toggle" type="button" data-theme-toggle>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <div class="tabs" role="group" aria-label="Soort">
      <button class="pill" type="button" data-tab="pakketten" aria-pressed="true">Nieuwe pakketten</button>
      <button class="pill" type="button" data-tab="voorstellen" aria-pressed="false">Wijzigingsvoorstellen</button>
    </div>
    <div class="layout">
      <nav class="queue" id="queue" aria-label="Wachtrij"></nav>
      <section class="detail" id="detail" aria-live="polite"></section>
    </div>
    <p class="demo">Demo: <button class="link-btn" type="button" id="reset">voorbeelddata terugzetten</button> (lokaal; op de gedeelde databank enkel met ALLOW_RESET=1).</p>
  </main>

<script src="/static/js/theme.js"></script>
<script src="/static/js/data.js"></script>
<script src="/static/js/moderatie.js"></script>
</body>
</html>
